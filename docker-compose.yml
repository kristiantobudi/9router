services:
  9router:
    # Build from this repo (no upstream image pull)
    build:
      context: .
      dockerfile: Dockerfile
    image: 9router-app:local
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  # Optional RTK token-saver sidecar (external image). Remove this service
  # and the HEADROOM_URL env above if you don't use Headroom.
  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

volumes:
  9router-data:
    name: 9router-data
